<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0b10" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3e55" />
      <stop offset="50%" stop-color="#e0122b" />
      <stop offset="100%" stop-color="#990012" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Hexagon Shield -->
  <polygon points="128,14 230,68 230,188 128,242 26,188 26,68" 
           fill="url(#bgGrad)" stroke="#ff2238" stroke-width="4" stroke-opacity="0.8" />
  
  <!-- Subtle inner border -->
  <polygon points="128,26 218,74 218,182 128,230 38,182 38,74" 
           fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Speed slash lines in background -->
  <path d="M 60,60 L 196,196" stroke="#ff2238" stroke-width="2" stroke-opacity="0.15" />
  <path d="M 80,50 L 206,176" stroke="#ff2238" stroke-width="1" stroke-opacity="0.1" />

  <!-- Acer Nitro 'N' Monogram Flame/Lightning Shape -->
  <g filter="url(#glow)">
    <!-- Left Stalk of N -->
    <polygon points="62,70 94,70 78,186 46,186" fill="url(#redGrad)" />
    
    <!-- Diagonal Slash of N -->
    <polygon points="90,70 148,70 194,186 136,186" fill="url(#redGrad)" />
    
    <!-- Right Stalk of N -->
    <polygon points="162,70 200,70 184,186 146,186" fill="#ff4d63" />
    
    <!-- Cyber Accent Spike -->
    <polygon points="132,118 178,118 168,142 122,142" fill="url(#cyanGrad)" opacity="0.9" />
  </g>

  <!-- Speed notches on right border -->
  <line x1="218" y1="110" x2="228" y2="110" stroke="#00f0ff" stroke-width="3" />
  <line x1="218" y1="124" x2="228" y2="124" stroke="#ff2238" stroke-width="3" />
  <line x1="218" y1="138" x2="228" y2="138" stroke="#ff2238" stroke-width="3" />
</svg>
